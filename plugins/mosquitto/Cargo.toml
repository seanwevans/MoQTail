[package]
name = "moqtail-mosquitto"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "MoQTail selector filtering as a Mosquitto loadable module"

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]


[dependencies]
moqtail-core = { path = "../../crates/moqtail-core" }

[build-dependencies]
cc = "1"

[dev-dependencies]
ciborium = "0.2"
