---
name: Release

# Publishing is driven by tags so a release is an explicit act, not a
# side effect of merging. Tag the commit you want published:
#
#     git tag moqtail-core-v0.1.0 && git push origin moqtail-core-v0.1.0
#
# The job refuses to run if the tag and the crate's version disagree, so a
# forgotten version bump fails loudly instead of publishing the wrong thing.
'on':
  push:
    tags: ['moqtail-core-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Package and verify without publishing
        type: boolean
        default: true

jobs:
  publish-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#moqtail-core-v}"
          version="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "moqtail-core"))')"
          if [ "$tag" != "$version" ]; then
            echo "tag moqtail-core-v$tag does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Package and verify
        run: cargo package -p moqtail-core --locked

      - name: Publish to crates.io
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p moqtail-core --locked
