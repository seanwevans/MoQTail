---
name: CI

'on':
  push:
    branches: [main, work]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Format check
        run: cargo fmt --check

      - name: Clippy check
        run: cargo clippy --workspace -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      # The plugins declare `crate-type = ["rlib"]` so that clippy and the test
      # binaries above cover their sources on all three runners without anyone
      # linking a shared library. The loadable artifact is asked for explicitly
      # here, and only on Linux: it deliberately leaves the broker's own symbols
      # undefined until the broker dlopen()s it, which the Mach-O and PE linkers
      # reject.
      - name: Build broker plugins
        if: runner.os == 'Linux'
        run: |
          cargo rustc -p moqtail-mosquitto --crate-type cdylib
          cargo rustc -p moqtail-emqx --crate-type cdylib

      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux'
        run: cargo install cargo-llvm-cov --locked

      - name: Generate coverage
        if: runner.os == 'Linux'
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload coverage artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: lcov.info
