[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "moqtail"
description = "Python bindings for the MoQTail selector engine"
requires-python = ">=3.8"
license = { text = "MIT OR Apache-2.0" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[tool.maturin]
module-name = "moqtail_py"
# The Cargo feature is off by default so that `cargo test` can link a test
# binary; the wheel always needs it.
features = ["extension-module"]
