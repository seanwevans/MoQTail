[package]
name = "moqtail-python"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "moqtail_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }
moqtail-core = { version = "0.1.0", path = "../../crates/moqtail-core" }
